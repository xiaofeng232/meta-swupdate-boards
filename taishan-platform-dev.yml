header:
  version: 14
  includes:
    - kas/rpi-base-dev.yml
    - kas/rpi-swupdate.yml

machine: taishan-64

target: 
  - core-image-taishan

repos:  
  meta-taishan:
    path: ./
    layers:
      meta-taishan:

local_conf_header:
  taishan-64: |
    IMAGE_FEATURES:append = " read-only-rootfs"
    IMAGE_FEATURES:remove = " splash x11 wayland"
    IMAGE_INSTALL:append = " \
        swupdate swupdate-www swupdate-tools \
        i2c-tools spi-tools can-utils \
        watchdog networkmanager \
    "
    IMAGE_FSTYPES = "wic wic.bz2 wic.bmap ext4.gz"
    IMAGE_ROOTFS_SIZE = "3145728"
