header:
  version: 11

machine: raspberrypi4-64
distro: poky
target:
  - core-image-base

repos:
  # taishan-yocto
  meta-raspberrypi:
    url: git@github.com:xiaofeng232/meta-raspberrypi.git
    path: layers/meta-raspberrypi
    refspec: scarthgap

  # poky
  poky:
    url: git@github.com:xiaofeng232/poky.git
    path: layers/poky
    refspec: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  # openembedded
  meta-openembedded:
    url: git@github.com:xiaofeng232/meta-openembedded.git
    path: layers/meta-openembedded
    refspec: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:

  #qt5
  meta-qt5:
    url: git@github.com:xiaofeng232/meta-qt5.git
    path: layers/meta-qt5
    refspec: scarthgap
  
  meta-taishan:
    path: ./meta-taishan

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
local_conf_header:
  rpi-specific: |
    ENABLE_I2C = "1"
    ENABLE_UART = "1"
    RPI_EXTRA_CONFIG = "dtoverlay=disable-bt"
  reduce_diskspace: |
    INHERIT += "rm_work_and_downloads"
    RM_WORK_MAX_PRESERVE = "0"
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-rt"
    IMAGE_FSTYPES = "ext4.xz rpi-sdimg"
    SDIMGE_ROOTFS_TYPE = "ext4.xz"
  raspberrypi-licenses: | 
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks tools-sdk package-management"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"