header:
  version: 8

machine: raspberrypi4-64
distro: poky
target:
  - rpi-test-image

repos:

  poky:
    url: git@github.com:xiaofeng232/poky.git
    path: layers/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: git@github.com:xiaofeng232/meta-openembedded.git
    path: layers/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:

  meta-raspberrypi:
    url: git@github.com:xiaofeng232/meta-raspberrypi.git
    path: layers/meta-raspberrypi
    branch: scarthgap

  meta-swupdate:
    url: git@github.com:xiaofeng232/meta-swupdate.git
    path: layers/meta-swupdate
    branch: scarthgap

  meta-taishan:
    url: git@github.com:xiaofeng232/meta-taishan.git
    path: layers/meta-taishan
    branch: scarthgap

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
local_conf_header:
  standard: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
    ENABLE_UART = "1"
    CONF_VERSION = "2"
    RPI_USE_U_BOOT = "1"
    USER_CLASSES ?="buildstats"
    PATCHRESOLVE = "noop"
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
    DISTRO_FEATURES:append = " systemd usrmerge"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED:append = "sysvinit"
    VIRTUAL-RUNTIME_initscripts = ""
    IMAGE_FSTYPES += " ext4 ext4.gz wic wic.bz2"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"