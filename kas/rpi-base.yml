header:
  version: 14
  includes:
    - kas/base.yml

machine: raspberrypi4-64
distro: poky

target: 
  - rpi-test-image

repos:
  meta-raspberrypi:
    url: git@github.com:xiaofeng232/meta-raspberrypi.git
    path: layers/meta-raspberrypi
    branch: scarthgap
    
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  package: |
    PACKAGE_CLASSES = "package_ipk"
    EXTRA_IMAGE_FEATURES += "package-management"