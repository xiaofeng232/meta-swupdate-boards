# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-taishan"
BBFILE_PATTERN_meta-taishan = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-taishan = "6"

LAYERDEPENDS_meta-taishan = "core"
LAYERSERIES_COMPAT_meta-taishan = "scarthgap"
